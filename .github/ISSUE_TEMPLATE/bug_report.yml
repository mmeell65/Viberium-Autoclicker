name: Bug report
description: Сообщить об ошибке / Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Чем больше деталей, тем быстрее получится починить.
  - type: input
    id: version
    attributes:
      label: Версия Viberium
      description: Указана внизу сайдбара или в настройках
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть страницу «Клавиатура»
        2. Назначить горячую клавишу
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Дополнительно
      description: Скриншоты, логи, особенности системы
    validations:
      required: false
